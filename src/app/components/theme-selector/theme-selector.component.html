<!-- src/app/components/theme-selector/theme-selector.component.html -->
<div class="theme-selector-container">
  <!-- Botón principal para abrir/cerrar selector -->
  <ion-button
    fill="clear"
    (click)="toggleSelector()"
    class="theme-toggle-btn"
    [attr.aria-label]="'Cambiar tema'"
  >
    <ion-icon
      [name]="getCurrentIcon()"
      slot="icon-only"
      class="theme-icon"
    ></ion-icon>
  </ion-button>

  <!-- Panel de selección de temas -->
  <div
    class="theme-panel"
    *ngIf="showSelector"
    [@fadeIn]
  >
    <div class="theme-panel-header">
      <h4 class="theme-panel-title">Seleccionar Tema</h4>
      <ion-button
        fill="clear"
        size="small"
        (click)="toggleSelector()"
        class="close-btn"
      >
        <ion-icon name="close" slot="icon-only"></ion-icon>
      </ion-button>
    </div>

    <ion-list class="theme-list">
      <ion-item
        *ngFor="let theme of themes"
        (click)="changeTheme(theme.name)"
        [class.active]="isActive(theme.name)"
        button
        detail="false"
        class="theme-item"
      >
        <ion-icon
          [name]="theme.icon"
          slot="start"
          class="theme-item-icon"
        ></ion-icon>
        <ion-label class="theme-item-label">
          {{ theme.label }}
        </ion-label>
        <ion-icon
          *ngIf="isActive(theme.name)"
          name="checkmark-circle"
          slot="end"
          class="checkmark-icon"
        ></ion-icon>
      </ion-item>
    </ion-list>

    <!-- Vista previa rápida -->
    <div class="theme-preview">
      <div class="preview-badge legacy" *ngIf="isActive('legacy')">
        <span class="badge-dot"></span>
        Tema Legacy Activo
      </div>
      <div class="preview-badge light" *ngIf="isActive('light')">
        <span class="badge-dot"></span>
        Tema Claro Activo
      </div>
      <div class="preview-badge dark" *ngIf="isActive('dark')">
        <span class="badge-dot"></span>
        Tema Oscuro Activo
      </div>
      <div class="preview-badge auto" *ngIf="isActive('auto')">
        <span class="badge-dot"></span>
        Tema Automático
      </div>
    </div>
  </div>
</div>
