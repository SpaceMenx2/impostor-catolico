<!-- src/app/pages/home/home.page.html -->
<ion-content class="home-content">

  <!-- Fondo con estrellas decorativas -->
  <div class="bg-layer">
    <div class="star s1"></div>
    <div class="star s2"></div>
    <div class="star s3"></div>
    <div class="star s4"></div>
    <div class="star s5"></div>
    <div class="light-beam lb1"></div>
    <div class="light-beam lb2"></div>
  </div>

  <div class="home-container">

    <!-- Logo / Cruz animada -->
    <div class="logo-section animate-fadeInUp">
      <div class="cross-container animate-pulse">
        <svg viewBox="0 0 80 100" xmlns="http://www.w3.org/2000/svg" class="cross-svg">
          <rect x="30" y="0"  width="20" height="100" rx="4" fill="url(#goldGrad)"/>
          <rect x="0"  y="25" width="80" height="20"  rx="4" fill="url(#goldGrad)"/>
          <defs>
            <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%"   stop-color="#f0c940"/>
              <stop offset="100%" stop-color="#a87d10"/>
            </linearGradient>
          </defs>
        </svg>
        <!-- Resplandor -->
        <div class="cross-glow"></div>
      </div>
    </div>

    <!-- Título principal -->
    <div class="title-section animate-fadeInUp delay-2">
      <h1 class="game-title">
        <span class="title-line1">IMPOSTOR</span>
        <span class="title-line2">de Catequesis</span>
      </h1>
      <p class="subtitle">Un juego para aprender y divertirse en comunidad</p>
    </div>

    <!-- Mensaje inspirador -->
    <div class="inspire-block animate-fadeInUp delay-3">
      <ion-icon name="chatbubble-ellipses-outline" class="inspire-icon"></ion-icon>
      <p class="inspire-text">{{ inspireMessage }}</p>
    </div>

    <!-- Botón de inicio -->
    <div class="action-section animate-fadeInUp delay-4">
      <ion-button
        expand="block"
        class="btn-start"
        (click)="goToPlayers()"
      >
        <ion-icon slot="start" name="people-outline"></ion-icon>
        Comenzar Partida
      </ion-button>

      <div class="divider-text">
        <span>✦</span>
      </div>

      <!-- Info breve del juego -->
      <div class="game-info">
        <div class="info-item">
          <ion-icon name="person-outline"></ion-icon>
          <span>3+ jugadores</span>
        </div>
        <div class="info-item">
          <ion-icon name="time-outline"></ion-icon>
          <span>10–20 min</span>
        </div>
        <div class="info-item">
          <ion-icon name="school-outline"></ion-icon>
          <span>Catequesis</span>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="home-footer animate-fadeInUp delay-5">
      <p>Hecho con ♥ para grupos parroquiales</p>
    </div>

  </div>
</ion-content>
